[project]
name = "ziginetops-backend"
version = "0.1.0"
description = "FastAPI backend for the ZIGINetOps AIOps portal"
requires-python = ">=3.11"
dependencies = [
  "aiofiles",
  "boto3",
  "fastapi",
  "pydantic-settings",
  "python-multipart",
  "scapy",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
